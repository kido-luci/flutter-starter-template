name: shared_contracts
description: >-
  Cross-feature domain contracts for flutter-starter-template: lightweight
  projections and reader interfaces shared between optional feature packages
  and the core app.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  architecture: ^0.1.0
  injectable: ^3.0.0

dev_dependencies:
  build_runner: ^2.15.1
  injectable_generator: ^3.0.2
