name: database_drift
description: >-
  Centralized Drift/SQLite persistence: every table definition, generated
  bindings, and the AppDatabase lifecycle wrapper. Renamed to `database` by
  `fst create --database drift` to serve as a drop-in replacement for the
  ObjectBox database package.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # fst:revsync:start
  # Only the sync-aware entities need this, and they go with the backend.
  rev_sync:
    path: ../../published/rev_sync
  # fst:revsync:end
  # Held below 2.34.1 together with drift_dev: `objectbox_generator` (see
  # packages/database) caps `analyzer` at <11.0.0 for the whole workspace, which
  # in turn caps drift_dev at 2.34.0 — and 2.34.0's schema verifier does not
  # compile against drift >=2.34.1, which dropped `allSchemaEntities` from the
  # drift3 preview. Lift both caps once objectbox_generator allows analyzer >=11.
  drift: ">=2.22.0 <2.34.1"
  drift_flutter: ^0.3.1

dev_dependencies:
  build_runner: ^2.15.1
  # See the drift cap above — these two must move together.
  drift_dev: ">=2.22.0 <2.34.1"
  flutter_test:
    sdk: flutter
