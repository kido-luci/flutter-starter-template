name: feature_auth
description: >-
  Authentication feature for the Flutter starter template: sign-in / register /
  change-password / delete-account, the token-refreshing network stack, and the
  Session implementation — packaged as a self-contained workspace package.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # Workspace packages.
  architecture: ^0.1.0
  network: ^0.1.0
  storage: ^0.1.0
  analytics: ^0.1.0
  app_ui: ^0.1.0
  shared_contracts: ^0.1.0
  shared_ui: ^0.1.0
  localization: ^0.1.0

  # Third-party.
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  injectable: ^3.0.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  font_awesome_flutter: ^11.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.9
  injectable_generator: ^3.0.2
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  test_utils: ^0.1.0

flutter:
  assets:
    - assets/icons/
