name: sync_connectivity_plus
description: >-
  connectivity_plus adapter for the sync engine. Implements the sync package's
  ConnectivitySource port so the offline-first scheduler stays plugin-agnostic.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  connectivity_plus: ^7.3.1
  injectable: ^3.0.0
  rev_sync:
    path: ../../published/rev_sync

dev_dependencies:
  build_runner: ^2.15.1
  injectable_generator: ^3.0.2
