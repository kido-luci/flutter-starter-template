name: CI

# Path filtering is done at the JOB level (see the `changes` gate below), NOT
# here via `paths-ignore`. The four build jobs are *required* status checks: a
# workflow skipped by `paths-ignore` never reports those contexts, so branch
# protection waits on them forever and a docs-only PR can never merge. Starting
# the workflow unconditionally and skipping the heavy jobs with an `if:` keeps
# the same CI-minute savings (a skipped required check counts as passing) while
# avoiding that deadlock.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal default token scope; no job writes to the repo. The Codecov upload
# tolerates failure (fail_ci_if_error: false), so read access is sufficient.
permissions:
  contents: read

jobs:
  # Gate: decide whether the expensive build jobs need to run. `code` is true
  # when any changed path could affect the Flutter build — i.e. anything outside
  # the docs/tooling allowlist below. The heavy jobs gate on this output: for a
  # docs-only change they are *skipped* (not absent), and a skipped required
  # check satisfies branch protection, so the PR stays mergeable. This is the
  # inverse of the former `paths-ignore` list — '**' selects everything, then
  # the negations subtract paths that can't affect the build. Keep them in sync.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Filter paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # Use the `every` quantifier so a path matches `code` only when it
          # satisfies ALL patterns — i.e. it matches `**` AND is not excluded by
          # any `!` negation below. The action's default (`some`) matches when
          # ANY pattern hits, and since `**` always hits, the negations are dead
          # and `code` is permanently true — so docs/tooling/submodule-only PRs
          # never actually skip the heavy jobs. `every` makes the exclusions real.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!doc/**'
              - '!LICENSE'
              - '!.mcp.json'
              - '!.agents/**'
              - '!.vscode/**'
              - '!.antigravity/**'
              - '!.antigravitycli/**'
              - '!.mcp/**'
              - '!.codegraph/**'
              - '!.commandcode/**'
              - '!skills-lock.json'
              - '!.antigravityrules'
              - '!.coderabbit.yaml'
              - '!.githooks/**'
              - '!.gitattributes'
              - '!.gitmodules'
              - '!.github/dependabot.yml'
              # Submodule pointer bumps (incl. Dependabot's). These two aren't
              # part of the Flutter build and aren't checked out, so a gitlink
              # change can't affect these jobs. (published/rev_sync is deliberately
              # NOT excluded: it's a path-dependency of the build, is checked out,
              # and its bumps must trigger these jobs.)
              - '!simple_backend_server'
              - '!published/cli'

  analyze-and-test:
    name: Analyze & Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # rev_sync is a published package vendored as a submodule but consumed as
      # a path dependency, so unlike the Go backend / CLI submodules it must be
      # checked out for `flutter pub get` to resolve. Fetch only that submodule.
      - name: Check out rev_sync submodule
        run: git submodule update --init published/rev_sync

      # Pin to the same Flutter SDK as .fvmrc (3.44.0). Bump both together.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      # --enforce-lockfile makes CI resolve exactly what pubspec.lock pins, so a
      # stale or uncommitted lockfile fails the build instead of silently
      # resolving newer versions.
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # NOTE: we deliberately do NOT cache .dart_tool/build here. Generated
      # files are git-ignored, so the checkout has none; a restored build cache
      # makes build_runner believe outputs already exist and skip regenerating
      # them (observed with flutter_gen's assets.gen.dart), yielding a broken
      # tree. A fresh full build from an empty cache is correct, if slower.

      # Generate code so analyze/test see it. Most generated files
      # (*.g.dart, *.freezed.dart, *.config.dart, *.gen.dart) are git-ignored
      # and produced fresh here. ObjectBox's binding
      # (packages/database/lib/objectbox.g.dart) and model
      # (packages/database/lib/objectbox-model.json) ARE tracked — they hold
      # stable schema UIDs — so the diff guard fails the build if those drift,
      # i.e. someone changed an @Entity without committing the regenerated
      # binding. The binding's $lib$ aggregate builder is per-package, so it must
      # be generated inside the database package, not by the app-root run.
      - name: Generate code & verify ObjectBox binding is up to date
        run: |
          ./tool/codegen.sh
          (cd packages/database && dart run build_runner build --delete-conflicting-outputs)
          objectbox_files="packages/database/lib/objectbox.g.dart packages/database/lib/objectbox-model.json"
          if ! git diff --quiet --exit-code -- $objectbox_files; then
            echo "::error::ObjectBox generated files are out of date. Run 'dart run build_runner build --delete-conflicting-outputs' inside packages/database and commit the binding + model."
            git diff --stat -- $objectbox_files
            exit 1
          fi

      # Localizations are generated (generate: true) and the output under
      # packages/localization/lib/l10n/ is tracked in git, so editing an .arb
      # without regenerating AppLocalizations would drift undetected. Regenerate
      # and fail if the tracked output changes — the same guard we use for the
      # ObjectBox binding. l10n.yaml lives in the localization package now.
      - name: Verify localizations are up to date
        run: |
          (cd packages/localization && flutter gen-l10n)
          l10n_files="packages/localization/lib/l10n/app_localizations*.dart"
          if ! git diff --quiet --exit-code -- $l10n_files; then
            echo "::error::Generated localizations are out of date. Run 'flutter gen-l10n' inside packages/localization and commit the AppLocalizations output."
            git diff --stat -- $l10n_files
            exit 1
          fi

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # Golden tests are excluded: Flutter goldens are not guaranteed to match
      # across operating systems, and baselines are generated on macOS while
      # this runner is Ubuntu. They run locally as a regression check (see
      # dart_test.yaml). Integration tests under integration_test/ also do not
      # run here — they boot the real assembled App against an actual platform
      # target (no headless flutter_tester support), which this runner doesn't
      # have set up. Run them locally before release: see
      # integration_test/README.md.
      - name: Run tests
        run: |
          flutter test --coverage --exclude-tags golden

          # Root tests can import workspace packages, but package-owned tests
          # now live under packages/*/test. Keep package source coverage owned
          # by each package test run so package files are not double-counted.
          root_lcov="$(mktemp)"
          awk '
            BEGIN { include = 1 }
            /^SF:/ { include = ($0 !~ /^SF:packages\//) }
            include { print }
          ' coverage/lcov.info > "$root_lcov"
          mv "$root_lcov" coverage/lcov.info

          for package in packages/*; do
            if [ ! -d "$package/test" ]; then
              continue
            fi

            (
              cd "$package"
              flutter test --coverage --exclude-tags golden
            )

            if [ -f "$package/coverage/lcov.info" ]; then
              sed "s|^SF:|SF:$package/|" \
                "$package/coverage/lcov.info" >> coverage/lcov.info
            fi
          done

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      # Fail the build if line coverage drops below the threshold. Generated
      # files are excluded so the percentage reflects hand-written code only.
      # Current workspace baseline is ~54%; raise `min_coverage` as coverage improves.
      - name: Enforce coverage threshold
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: coverage/lcov.info
          min_coverage: 53
          exclude: >-
            **/*.g.dart
            **/*.freezed.dart
            **/*.config.dart
            **/*.gen.dart
            **/firebase_options.dart
            lib/l10n/**

      # Publish coverage to Codecov for PR comments and trend tracking. This is
      # informational only — it never gates the build (fail_ci_if_error: false),
      # and `always()` uploads even when the threshold above fails. Tokenless
      # upload works for public repos; set CODECOV_TOKEN to authenticate if you
      # hit rate limits.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Compile smoke-test: `flutter analyze` type-checks Dart but never assembles
  # the app, so Gradle/plugin/asset/manifest regressions slip past it and only
  # surface at release time. This job catches them per-PR by building an
  # unsigned debug APK. Debug (not release) keeps it secret-free: it signs with
  # the auto-generated debug keystore, so no signing material is needed and the
  # job runs on fork PRs too. The real signed release build still happens in
  # release.yml before shipping.
  build-android:
    name: Build Android (debug)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # rev_sync is a published package vendored as a submodule but consumed as
      # a path dependency, so unlike the Go backend / CLI submodules it must be
      # checked out for `flutter pub get` to resolve. Fetch only that submodule.
      - name: Check out rev_sync submodule
        run: git submodule update --init published/rev_sync

      # Pin to the same Flutter SDK as .fvmrc (3.44.0). Bump both together.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      # Cache Gradle's downloaded dependencies and wrapper so the Android build
      # doesn't refetch the toolchain + dependencies every run. Keyed on the
      # Gradle build files; restore-keys give a partial-cache fallback. Only
      # external deps are cached here, not generated Dart — the build_runner
      # caching caveat documented above does not apply to Gradle's cache.
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # The com.google.gms.google-services Gradle plugin parses
      # google-services.json at build time (it never contacts Firebase), and
      # the file is git-ignored — so a fresh checkout has none and Gradle fails
      # without it. We write a placeholder rather than restoring the real config
      # from a secret: a smoke-test only needs the app to assemble, and a
      # secret-free job keeps working on fork PRs. The package_name must match
      # the flavor we build (dev → base applicationId + ".dev"); update it here
      # if android/app/build.gradle.kts flavor suffixes change.
      - name: Generate placeholder google-services.json
        run: |
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.lucistudio.flutter_starter_template.dev"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaPlaceholderCiKey0000000000000000000" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      # Generated code (*.g.dart, *.freezed.dart, etc.) is git-ignored, and
      # `flutter build` does not run build_runner — so generate it here before
      # building, or the Dart compile fails on missing sources. As in the test
      # job, we do NOT cache .dart_tool/build: with the outputs git-ignored, a
      # restored cache makes build_runner skip files it believes exist,
      # producing a broken tree.
      - name: Generate code
        run: |
          flutter pub get --enforce-lockfile
          ./tool/codegen.sh

      # The app uses Android flavors (dev/staging/prod), so a flavor is
      # required. dev is the natural debug target.
      - name: Build debug APK
        run: flutter build apk --debug --flavor dev

  # iOS counterpart of build-android: catches the CocoaPods/SPM/Podfile and
  # native-plugin breakage class that only surfaces when Xcode actually
  # assembles the app. --no-codesign skips certificates/provisioning entirely,
  # so this needs no Apple secrets and the signed TestFlight build still lives
  # in release.yml. macOS runners are free for public repos, so this runs on
  # every PR; the only cost is wall-clock time (pod install + native compile).
  build-ios:
    name: Build iOS (debug, no codesign)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # rev_sync is a published package vendored as a submodule but consumed as
      # a path dependency, so unlike the Go backend / CLI submodules it must be
      # checked out for `flutter pub get` to resolve. Fetch only that submodule.
      - name: Check out rev_sync submodule
        run: git submodule update --init published/rev_sync

      # connectivity_plus 7.x compiles against the iOS 26 SDK: it references
      # NWPath.isUltraConstrained behind an `if #available(iOS 26.0, *)`, but
      # the symbol must still exist at compile time. The macos-15 runner's
      # default Xcode is older and lacks that SDK, so select the latest stable
      # Xcode (which ships the iOS 26 SDK). Bump runner/Xcode together with the
      # SDK requirement if a plugin later needs a newer one.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Pin to the same Flutter SDK as .fvmrc (3.44.0). Bump both together.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      # Cache the installed Pods and the CocoaPods download cache so the
      # `pod install` that `flutter build ios` runs doesn't refetch every pod
      # each run. Keyed on the committed ios/Podfile.lock; restore-keys give a
      # partial-cache fallback when the lockfile changes.
      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # This project requires CocoaPods, not SPM (see CLAUDE.md). The setting is
      # machine-global, so each runner must disable SPM before the first build.
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      # GoogleService-Info.plist is git-ignored but the Xcode project references
      # it as a bundled resource, so a fresh checkout fails with "Build input
      # file cannot be found". As on Android, write a placeholder rather than
      # restoring the real plist from a secret: Firebase reads it at runtime,
      # never at compile time, so dummy values assemble fine and the job stays
      # secret-free and fork-friendly.
      - name: Generate placeholder GoogleService-Info.plist
        run: |
          cat > ios/Runner/GoogleService-Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>API_KEY</key>
          	<string>AIzaPlaceholderCiKey0000000000000000000</string>
          	<key>GCM_SENDER_ID</key>
          	<string>000000000000</string>
          	<key>BUNDLE_ID</key>
          	<string>com.lucistudio.flutter_starter_template.dev</string>
          	<key>PROJECT_ID</key>
          	<string>ci-placeholder</string>
          	<key>STORAGE_BUCKET</key>
          	<string>ci-placeholder.appspot.com</string>
          	<key>IS_ADS_ENABLED</key>
          	<false/>
          	<key>IS_ANALYTICS_ENABLED</key>
          	<false/>
          	<key>IS_APPINVITE_ENABLED</key>
          	<true/>
          	<key>IS_GCM_ENABLED</key>
          	<true/>
          	<key>IS_SIGNIN_ENABLED</key>
          	<true/>
          	<key>GOOGLE_APP_ID</key>
          	<string>1:000000000000:ios:0000000000000000000000</string>
          </dict>
          </plist>
          EOF

      # firebase.json (git-ignored) drives the FlutterFire Crashlytics build
      # phase. Write a placeholder with "uploadDebugSymbols": false so the
      # `flutterfire upload-crashlytics-symbols` phase reads it and skips the
      # upload entirely — without it the phase throws PathNotFoundException, and
      # with upload enabled it would need a real Firebase project. dSYM upload is
      # a release concern handled in release.yml, not this smoke-test.
      - name: Generate placeholder firebase.json
        run: |
          cat > firebase.json <<'EOF'
          {
            "flutter": {
              "platforms": {
                "android": {
                  "default": {
                    "projectId": "ci-placeholder",
                    "appId": "1:000000000000:android:0000000000000000000000",
                    "fileOutput": "android/app/google-services.json"
                  }
                },
                "ios": {
                  "default": {
                    "projectId": "ci-placeholder",
                    "appId": "1:000000000000:ios:0000000000000000000000",
                    "uploadDebugSymbols": false,
                    "fileOutput": "ios/Runner/GoogleService-Info.plist"
                  }
                },
                "dart": {
                  "lib/firebase_options.dart": {
                    "projectId": "ci-placeholder",
                    "configurations": {
                      "android": "1:000000000000:android:0000000000000000000000",
                      "ios": "1:000000000000:ios:0000000000000000000000"
                    }
                  }
                }
              }
            }
          }
          EOF

      # Generated code (*.g.dart, *.freezed.dart, etc.) is git-ignored, and
      # `flutter build` does not run build_runner — so generate it here before
      # building. As elsewhere, we do NOT cache .dart_tool/build: a restored
      # cache makes build_runner skip files it believes exist, producing a
      # broken tree.
      - name: Generate code
        run: |
          flutter pub get --enforce-lockfile
          ./tool/codegen.sh

      # The Xcode project has a FlutterFire build phase that runs
      # `flutterfire upload-crashlytics-symbols`; without the CLI on PATH the
      # phase fails with "flutterfire: command not found". Install it so the
      # phase resolves — on a debug build there are no dSYMs to upload, so it
      # no-ops. (The build-phase script already adds ~/.pub-cache/bin to PATH.)
      - name: Install FlutterFire CLI
        run: |
          dart pub global activate flutterfire_cli 1.4.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # dev flavor maps to the shared dev.xcscheme. --no-codesign skips signing
      # so no certificates or provisioning profiles are needed.
      - name: Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign --flavor dev

  # Golden (pixel-comparison) tests are excluded from analyze-and-test because
  # Flutter goldens are not stable across operating systems and that job runs on
  # Ubuntu, while the baselines are generated on macOS. Run them here on macOS —
  # matching the baselines — so UI regressions are caught in CI. They currently
  # live in packages/app_ui, which has no codegen, so no build_runner is needed.
  golden-tests:
    name: Golden tests (macOS)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # rev_sync is a published package vendored as a submodule but consumed as
      # a path dependency, so unlike the Go backend / CLI submodules it must be
      # checked out for `flutter pub get` to resolve. Fetch only that submodule.
      - name: Check out rev_sync submodule
        run: git submodule update --init published/rev_sync

      # Pin to the same Flutter SDK as .fvmrc (3.44.0). Bump both together.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run golden tests
        working-directory: packages/app_ui
        run: flutter test --tags golden

      # On mismatch, the golden harness writes actual/diff PNGs under a
      # `failures/` directory next to the baselines. Upload them so a reviewer
      # can see exactly what changed.
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: 'packages/app_ui/test/**/failures/**'
          if-no-files-found: ignore
